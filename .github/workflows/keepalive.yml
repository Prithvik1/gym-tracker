name: keepalive
# Ping the Render free backend so it doesn't spin down (15-min idle sleep →
# ~50s cold start). ponytail: GitHub cron is best-effort and can drift a few
# minutes; if cold starts still bite, move to UptimeRobot/cron-job.org.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://gym-tracker-x7e2.onrender.com/ > /dev/null
